# EXIT=124 de `timeout` es mudo -- no distingue "colgado" de "lento", y
# esta suite ya varió 539-1093 s en la misma máquina según contención de
# disco (fsync de SQLite), no CPU. Con esto puesto, cualquier test que
# pase de 180 s vuelca a stderr el stack de TODOS los hilos -- archivo,
# función y línea exactos donde se detuvo, en vez de una sospecha que
# obliga a rehacer una investigación completa (como la de esta misma
# fecha). Costo medido: cero -- verificado en 2 corridas completas que
# ya lo llevaban puesto sin que se disparara ni una vez.
faulthandler_timeout = 180
